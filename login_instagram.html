<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Instagram - Clone</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Roboto,sans-serif;
}

body{
    background:#0d1117;
    color:#fff;
    height:100vh;
}

.container{
    display:flex;
    height:100vh;
}

/* ESQUERDA */

.left{
    width:65%;
    background:#0b1015;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.logo{
    position:absolute;
    top:30px;
    left:40px;
    font-size:55px;
}

.texto{
    text-align:center;
}

.texto h1{
    font-size:64px;
    font-weight:400;
    line-height:1.1;
}

.texto span{
    color:#ff2b8a;
}

/* Imagem */

.mockup{
    margin-top:50px;
}

.mockup img{
    width:450px;
    border-radius:30px;
}

/* DIREITA */

.right{
    width:35%;
    background:#1d1d22;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login{
    width:420px;
}

.login h2{
    margin-bottom:30px;
    font-size:30px;
}

input{
    width:100%;
    height:52px;
    margin-bottom:15px;
    padding:15px;
    border:1px solid #555;
    border-radius:8px;
    background:transparent;
    color:white;
    outline:none;
    font-size:15px;
}

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.entrar{
    background:#1f6fff;
    color:white;
    margin-top:10px;
}

.esqueci{
    display:block;
    text-align:center;
    color:white;
    text-decoration:none;
    margin:25px 0;
}

.facebook{
    background:transparent;
    color:white;
    border:1px solid #555;
    margin-bottom:15px;
}

.criar{
    background:transparent;
    color:#3797ff;
    border:1px solid #3797ff;
}

.meta{
    text-align:center;
    margin-top:40px;
    color:#aaa;
    font-size:18px;
}

/* Rodapé */

footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b1015;
    color:#999;
    text-align:center;
    padding:15px;
    font-size:13px;
}

footer a{
    color:#999;
    text-decoration:none;
    margin:0 10px;
}


</style>

</head>
<body>

<div class="container">

    <div class="left">

        <div class="logo">📸</div>

        <div class="texto">

            <h1>
                Veja momentos do dia a dia<br>
                dos seus <span>amigos próximos.</span>
            </h1>

            <div class="mockup">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600" alt="">
            </div>

        </div>

    </div>

    <div class="right">

        <div class="login">

            <h2>Entrar no Instagram</h2>

            <input type="text">

            <input type="password">

            <button class="entrar">Entrar</button>

            <a href="#" class="esqueci">Esqueceu a senha?</a>

            <button class="facebook">
                Entrar com o Facebook
            </button>

            <button class="criar">
                Criar nova conta
            </button>

            <div class="meta">
                Meta
            </div>

        </div>

    </div>

</div>

<footer>

<a href="#">Meta</a>
<a href="#">Sobre</a>
<a href="#">Blog</a>
<a href="#">Ajuda</a>
<a href="#">API</a>
<a href="#">Privacidade</a>
<a href="#">Termos</a>
<a href="#">Localizações</a>

</footer>

</body>
</html>
